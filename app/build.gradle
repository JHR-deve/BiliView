plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'local.bilimp4.app'
    compileSdk 36

    defaultConfig {
        applicationId 'local.bilimp4.app'
        minSdk 29
        targetSdk 36
        versionCode 11
        versionName '0.6.3'
        buildConfigField 'String', 'UPDATE_FEED_URL',
                groovy.json.JsonOutput.toJson(providers.gradleProperty('bilimp4UpdateFeed').getOrElse(''))
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.media3:media3-container:1.8.0'
    implementation 'androidx.media3:media3-extractor:1.8.0'
    implementation 'androidx.media3:media3-muxer:1.8.0'
    implementation 'androidx.media3:media3-effect:1.8.0'
    implementation 'androidx.media3:media3-transformer:1.8.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.protobuf:protobuf-javalite:4.31.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
